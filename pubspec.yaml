name: strivo
description: "Modern gym workout tracking app for serious lifters"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4

  # Local Database
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  collection: ^1.19.1

  # Icons
  lucide_icons: ^0.257.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/

# App launcher icon generation. Regenerate after changing the source PNG:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/strivo-icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#000000"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/strivo-icon.png"
