# Static analysis configuration for Strivo.
#
# Adopts the very_good_analysis ruleset (a strict superset of flutter_lints)
# and enables the analyzer's strict type-checking modes. Run with
# `flutter analyze`; it is also enforced in CI on every pull request.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  # Generated / tool-owned files are not hand-maintained, so they are excluded
  # from analysis. firebase_options.dart is produced by the FlutterFire CLI.
  exclude:
    - lib/firebase_options.dart
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**

linter:
  rules:
    # Strivo is a single application, not a published package, so it does not
    # document every public member or declare a library-level doc comment.
    public_member_api_docs: false
    # Keep flutter_riverpod/go_router ternaries and widget trees readable
    # without forcing an explicit return type on short closures.
    lines_longer_than_80_chars: false
    # pubspec dependencies are grouped by purpose with headings, which reads
    # better than a single flat alphabetical list.
    sort_pub_dependencies: false
